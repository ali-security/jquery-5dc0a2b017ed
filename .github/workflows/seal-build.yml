# Sealed build: build-and-pack only. The test suite runs on Travis (.travis.yml).
name: seal-build

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Resolve dependencies as of the 1.11.1 release (2014-05-01), so the
      # build uses the uglify-js that produced the published minified files.
      NPM_CONFIG_REGISTRY: https://:2014-05-01T18%3A05%3A32.863Z@time-machines-npm.sealsecurity.io/
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 0.10 (the project's Travis runtime)
        run: |
          curl -fsSL https://nodejs.org/dist/v0.10.48/node-v0.10.48-linux-x64.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-v0.10.48-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Install faketime
        run: sudo apt-get update -qq && sudo apt-get install -y -qq faketime

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm install
          npm install shelljs@0.2.6

      - name: Build release artifacts (grunt + dist/cdn copies, as build/release.js does)
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          faketime -f '@2014-05-01 17:42:00' node .github/seal/seal-release.js

      - name: Pack
        run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: jquery-npm-tarball
          path: jquery-*.tgz
          if-no-files-found: error
